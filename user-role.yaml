# The single role a person needs to use Scene Machine. Granting it admits the
# user through the Identity-Aware Proxy (IAP) front door, and that is all they
# need: the app runs every storage and Firestore action on its own runtime
# service account and hands the browser short-lived signed links, so users never
# touch Cloud Storage directly. That is why this role carries just the one
# IAP-access permission below — it stays one clear thing: "may use Scene Machine."
title: "Scene Machine User"
description: "Admits a person through IAP to use Scene Machine."
stage: "BETA"
includedPermissions:
  - iap.webServiceVersions.accessViaIAP
