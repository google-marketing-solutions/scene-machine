# Ruff configuration for the scene-machine skill package.
# Two-space indentation is the house style of the shipped scripts.
line-length = 100
indent-width = 2
target-version = "py310"
extend-exclude = ["dist", ".pytest-tmp", ".scene_machine"]

[lint]
select = ["E4", "E7", "E9", "F", "W"]

[format]
indent-style = "space"
quote-style = "double"
